# ---------------------------------------------------------------------------
# Monthly Green Book refresh, then publish to GitHub Pages.
#
# The site is built here and uploaded as a Pages artifact rather than being
# committed. That matters: the compiled site is ~100 MB (most of it the
# WebAssembly R runtime), so committing it every month would grow the
# repository without bound. Nothing generated is ever pushed back.
#
# data/raw is cached between runs, so only the first run pays for the full
# ~5,000-request crawl of FDA's API. Later runs diff the catalog and
# re-fetch only what changed, which usually takes a couple of minutes.
# ---------------------------------------------------------------------------

name: Update Green Book data and deploy site

on:
  schedule:
    # 06:00 UTC on the 6th of each month. FDA publishes the new Green Book
    # edition monthly but not on a fixed day; the 6th leaves room for it.
    - cron: "0 6 6 * *"
  workflow_dispatch:        # lets you run it by hand from the Actions tab
  push:
    branches: [main]
    paths:
      # Rebuild when the app or pipeline changes, but not for README-only edits.
      - "app/**"
      - "R/**"
      - "scripts/build_static_site.R"
      - "data/reference/**"
      - ".github/workflows/update-and-deploy.yml"

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write        # the monthly report is filed as an issue; see below

# Never let two deploys race; let a newer run supersede a queued one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R package dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: >
            any::shiny, any::bslib, any::reactable, any::dplyr, any::tidyr,
            any::stringr, any::purrr, any::readr, any::tibble, any::jsonlite,
            any::httr2, any::arrow, any::fs, any::glue, any::prettyunits,
            any::shinylive

      # Restoring the raw payloads turns the monthly run into an incremental
      # diff instead of a full re-crawl. The key rotates monthly so the cache
      # cannot go stale indefinitely; restore-keys let a new month start from
      # the previous month's crawl.
      - name: Cache raw FDA payloads
        uses: actions/cache@v4
        with:
          path: data/raw
          key: adafda-raw-${{ github.run_id }}
          restore-keys: |
            adafda-raw-

      - name: Refresh Green Book data
        run: Rscript R/04_monthly_update.R

      - name: Refresh NDC codes from DailyMed
        run: Rscript R/03_ndc_dailymed.R
        # DailyMed is occasionally unavailable. The app treats NDC as optional
        # and shows a search link instead, so a failure here must not block
        # publishing an otherwise-current Green Book.
        continue-on-error: true

      # Runs every month rather than annually. Links rot and guidelines age
      # continuously, and a yearly job is one that has eleven months to be
      # silently wrong -- one organization domain had already lapsed to a
      # parked page before anyone noticed. Never fails the build: an
      # association site behind bot protection must not block publishing
      # current FDA data.
      # Read the FDA application number off any label not already recorded in
      # data/reference/dailymed_appnumbers.csv. Without this a drug approved
      # since the last run would fall back to name matching, which is what put
      # a cattle injection label on a swine medicated article. Only new labels
      # are fetched, so this is cheap after the first run.
      - name: Read application numbers from new labels
        run: Rscript scripts/build_dailymed_appnumbers.R
        continue-on-error: true

      - name: Refresh manufacturer product pages
        run: Rscript scripts/build_manufacturer_links.R
        continue-on-error: true

      # Rebuild so the label links pick up the two reference tables above.
      # 04 ran the tidy step before they were refreshed.
      - name: Rebuild tables with the refreshed references
        run: Rscript R/02_tidy_greenbook.R

      - name: Check guideline links and ages
        run: Rscript scripts/check_guideline_links.R 2>&1 | tee -a "$GITHUB_STEP_SUMMARY"
        continue-on-error: true

      - name: Publish the changelog as a build summary
        if: always()
        run: |
          latest=$(ls -1 data/changelog/*.md 2>/dev/null | tail -1)
          if [ -n "$latest" ]; then
            cat "$latest" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No changelog produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      # Notification by GitHub Issue rather than SMTP. GitHub emails the
      # repository owner when an issue is opened, so this needs no mail server
      # and no stored password -- the built-in token is enough. It also leaves
      # a permanent, linkable record of each month's changes.
      #
      # Filed only when FDA actually changed something. A monthly "nothing
      # happened" email is the fastest way to train someone to ignore the one
      # that matters; a quiet month is still recorded in the app and in the
      # build summary.
      - name: File the monthly drug update as an issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest=$(ls -1 data/changelog/*.md 2>/dev/null | tail -1)
          [ -z "$latest" ] && { echo "No changelog produced."; exit 0; }

          # The changelog states its own counts; a run with nothing to report
          # has zero on all four lines.
          changed=$(grep -cE '^\- .*: \*\*[1-9]' "$latest" || true)
          if [ "$changed" -eq 0 ]; then
            echo "No drug changes this month; not filing an issue."
            exit 0
          fi

          title="Green Book update — $(date -u '+%B %Y')"

          # Ensure the label exists before using it: gh fails the whole issue
          # creation on an unknown label, which would lose the notification
          # over a cosmetic detail.
          gh label create "monthly-update" \
            --description "Automated monthly Green Book drug changes" \
            --color "0B6B5E" 2>/dev/null || true

          gh issue create --title "$title" --body-file "$latest" \
              --label "monthly-update" \
            || gh issue create --title "$title" --body-file "$latest" \
            || echo "Could not file the issue; the changelog is in the build summary above."

      - name: Build the static site
        run: Rscript scripts/build_static_site.R

      # The built site is kept as a normal artifact regardless, so it can be
      # downloaded and inspected even when publishing is switched off.
      - uses: actions/upload-artifact@v4
        with:
          name: static-site
          path: docs
          retention-days: 14

      - uses: actions/configure-pages@v5
        if: vars.PUBLISH_PAGES == 'true'

      - uses: actions/upload-pages-artifact@v3
        if: vars.PUBLISH_PAGES == 'true'
        with:
          path: docs

  # Publishing is opt-in via a repository variable rather than automatic.
  #
  # GitHub Pages does not serve from a private repository on a free plan, so
  # while this repo is private the deploy step would fail on every run and
  # bury real failures in noise. To publish: make the repository public,
  # enable Pages (Settings -> Pages -> Source: GitHub Actions), then add a
  # repository variable PUBLISH_PAGES = true (Settings -> Secrets and
  # variables -> Actions -> Variables).
  deploy:
    needs: build
    if: vars.PUBLISH_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
